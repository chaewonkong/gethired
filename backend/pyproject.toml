[project]
name = "gethired"
version = "0.2.0"
description = "내 이력서에 맞는 채용 공고만 모아 보여주는 로컬 앱"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.115",
    "filelock>=3.12",
    "httpx>=0.28.1",
    "platformdirs>=4.3",
    "pydantic>=2.14.0",
    "pypdf>=6.21.1",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/chaewonkong/gethired"

[project.scripts]
gethired = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["app/static/**"]

[tool.hatch.build.targets.sdist]
include = ["app/**", "pyproject.toml", "uv.lock"]
artifacts = ["app/static/**"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]
ignore = ["B008"]  # FastAPI Query(default=...) 관용구
