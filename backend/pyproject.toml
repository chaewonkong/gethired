[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "pypdf>=6.21.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
